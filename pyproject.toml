[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-photos-discovery"
version = "0.1.0"
description = "AI-powered discovery engine for Google Photos retrieval research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiofiles>=23.0",
    "click>=8.1",
    "fastapi>=0.100.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
discover = "discover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discover"]

[tool.hatch.build.targets.wheel.sources]
"discover" = "src/discover"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
